<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cây Đào Lì Xì 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;900&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --tet-red: #d32f2f; --tet-gold: #ffeb3b; --dark-red: #8e0000; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Lexend', sans-serif; 
            background: #620000; 
            color: var(--tet-gold); 
            min-height: 100vh; 
            overflow: hidden; /* Tránh cuộn trang để giữ dáng cây */
        }

        /* Container Cây Đào */
        .tree-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #af0000 0%, #620000 100%);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
        }

        /* Hình ảnh cây đào (Sử dụng CSS để vẽ hoặc dùng ảnh) */
        .tree-bg {
            position: absolute;
            bottom: -10%;
            height: 90%;
            z-index: 1;
            opacity: 0.8;
        }

        .header {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            z-index: 100; text-align: center; width: 90%;
            background: rgba(0,0,0,0.4); padding: 10px; border-radius: 20px; border: 1px solid var(--tet-gold);
        }
        #secretTitle { font-family: 'Pacifico', cursive; font-size: 1.5rem; cursor: pointer; }

        /* Style Lì Xì Treo */
        .lixi-treo {
            position: absolute;
            width: 35px;
            height: 50px;
            z-index: 10;
            cursor: pointer;
            transform-origin: top center;
            animation: swing 3s ease-in-out infinite;
            perspective: 1000px;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .flipped .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 5px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--tet-gold);
        }

        .card-front { background: var(--tet-red); box-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
        .card-front::after { content: "🧧"; font-size: 1.2rem; }
        
        /* Dấu hiệu nhận biết mờ */
        .mode-high .card-front::before { content: ""; position: absolute; top: 2px; left: 2px; width: 3px; height: 3px; background: var(--tet-gold); border-radius: 50%; opacity: 0.3; }

        .card-back { background: white; color: var(--tet-red); transform: rotateY(180deg); font-size: 0.5rem; font-weight: 900; text-align: center; }

        /* Stats & UI khác */
        .stats-overlay { position: absolute; bottom: 20px; width: 100%; text-align: center; z-index: 100; pointer-events: none; }
        .stats-box { display: inline-block; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; }

        .result-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; border: 5px solid var(--tet-gold); padding: 20px; border-radius: 20px; text-align: center; z-index: 3000; display: none; width: 280px; color: #333; }
        
        /* Admin Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 4000; padding: 20px; overflow-y: auto; }
        .modal-content { background: white; color: #333; padding: 20px; border-radius: 15px; }
    </style>
</head>
<body>

<div class="tree-container" id="treeWorld">
    <div class="header">
        <span id="adminTrigger" style="cursor:pointer">🐴</span>
        <h1 id="secretTitle">Cây Đào Tài Lộc</h1>
        <p id="modeIndicator" style="font-size: 0.6rem; opacity: 0.5;">Đang hiển thị: TÚI TÀI LỘC</p>
    </div>

    <svg class="tree-bg" viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg">
        <path d="M250 800 Q250 600 250 400 T250 100" stroke="#4e342e" stroke-width="20" fill="none"/>
        <path d="M250 600 Q150 500 80 450" stroke="#4e342e" stroke-width="10" fill="none"/>
        <path d="M250 550 Q350 450 420 400" stroke="#4e342e" stroke-width="10" fill="none"/>
        <path d="M250 400 Q100 300 50 200" stroke="#4e342e" stroke-width="8" fill="none"/>
        <path d="M250 350 Q400 250 450 150" stroke="#4e342e" stroke-width="8" fill="none"/>
        <circle cx="250" cy="150" r="10" fill="#ff80ab" opacity="0.6"/>
        <circle cx="100" cy="300" r="8" fill="#ff80ab" opacity="0.6"/>
        <circle cx="400" cy="250" r="8" fill="#ff80ab" opacity="0.6"/>
    </svg>

    <div id="lixiWrapper"></div>

    <div class="stats-overlay">
        <div class="stats-box">Lượt: <span id="picks">0</span> | Tổng: <span id="total">0đ</span></div>
    </div>
</div>

<div class="result-popup" id="resultPopup">
    <h3 style="color:var(--tet-red)">Chúc Mừng!</h3>
    <div id="winAmount" style="font-size: 2rem; font-weight: 900; margin: 10px 0;">0đ</div>
    <button onclick="closePopup()" style="padding:10px 20px; background:var(--tet-red); color:white; border:none; border-radius:10px;">Cảm ơn 🧧</button>
</div>

<div id="adminModal" class="modal">
    <div class="modal-content">
        <h3>Quản lý (Pass: Test@12345)</h3>
        <input type="password" id="adminPass" placeholder="Mật khẩu..." style="width:100%; padding:10px; margin:10px 0;">
        <button onclick="verifyAdmin()" style="width:100%; padding:10px; background:var(--tet-red); color:white; border:none;">Vào Admin</button>
        <div id="settingsArea" style="display:none; margin-top:20px;">
             <p>Bạn có thể tùy chỉnh code thêm ở đây như bản trước.</p>
             <button onclick="location.reload()" style="margin-top:20px;">Reset Toàn Bộ</button>
        </div>
    </div>
</div>

<script>
    let currentMode = 'high';
    let globalPicks = 0;
    let globalTotal = 0;
    let titleClicks = 0;
    let adminClicks = 0;

    const config = {
        low: [11111, 12345, 20000, 33333, 50000, 55555],
        high: [99999, 123456, 168168, 200000, 333333, 555555]
    };

    // Hàm tạo vị trí ngẫu nhiên quanh các "cành cây"
    function generateLixi() {
        const wrapper = document.getElementById('lixiWrapper');
        wrapper.innerHTML = '';
        const count = 50; // Giảm xuống 50 để tránh quá khít trên cây
        
        for (let i = 0; i < count; i++) {
            const lixi = document.createElement('div');
            lixi.className = `lixi-treo mode-${currentMode}`;
            
            // Random vị trí trong vùng tán cây (khoảng từ 15% đến 85% width, 20% đến 70% height)
            const left = 15 + Math.random() * 70;
            const top = 15 + Math.random() * 60;
            
            lixi.style.left = left + '%';
            lixi.style.top = top + '%';
            lixi.style.animationDelay = Math.random() * 2 + 's';

            const amt = getAmount();
            lixi.innerHTML = `
                <div class="card-inner">
                    <div class="card-front"></div>
                    <div class="card-back">${amt.toLocaleString()}đ</div>
                </div>
            `;

            lixi.onclick = function() {
                if (!this.classList.contains('flipped')) {
                    this.classList.add('flipped');
                    handlePick(amt);
                }
            };
            wrapper.appendChild(lixi);
        }
    }

    function getAmount() {
        let pool = config[currentMode];
        if (globalPicks < 5) pool = pool.filter(v => v < 250000);
        return pool[Math.floor(Math.random() * pool.length)];
    }

    function handlePick(amt) {
        globalPicks++; globalTotal += amt;
        document.getElementById('picks').innerText = globalPicks;
        document.getElementById('total').innerText = globalTotal.toLocaleString() + 'đ';
        setTimeout(() => {
            document.getElementById('winAmount').innerText = amt.toLocaleString() + 'đ';
            document.getElementById('resultPopup').style.display = 'block';
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }, 600);
    }

    function closePopup() { document.getElementById('resultPopup').style.display = 'none'; }

    // Secret: Nhấn Title 3 lần đổi Mode
    document.getElementById('secretTitle').onclick = function() {
        titleClicks++;
        if (titleClicks === 3) {
            currentMode = (currentMode === 'high') ? 'low' : 'high';
            document.getElementById('modeIndicator').innerText = currentMode === 'high' ? "Đang hiển thị: TÚI TÀI LỘC" : "Đang hiển thị: TÚI BÌNH AN";
            generateLixi();
            titleClicks = 0;
            this.style.transform = "scale(1.1)";
            setTimeout(() => this.style.transform = "scale(1)", 200);
        }
        setTimeout(() => titleClicks = 0, 1000);
    };

    // Admin: Nhấn Ngựa 3 lần
    document.getElementById('adminTrigger').onclick = function() {
        adminClicks++;
        if (adminClicks === 3) { document.getElementById('adminModal').style.display = 'block'; adminClicks = 0; }
        setTimeout(() => adminClicks = 0, 1000);
    };

    function verifyAdmin() {
        if (document.getElementById('adminPass').value === "Test@12345") {
            document.getElementById('settingsArea').style.display = 'block';
        } else { alert("Sai pass!"); }
    }

    window.onload = generateLixi;
</script>
</body>
</html>
