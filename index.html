<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cây Đào Lì Xì Bính Ngọ 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;900&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --tet-red: #d32f2f; --tet-gold: #ffeb3b; --dark-red: #620000; --sakura: #ffb7c5; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Lexend', sans-serif; 
            background: #4a0000; 
            min-height: 100vh; 
            overflow: hidden;
        }

        /* Container chính */
        .tree-world {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #8e0000 0%, #4a0000 100%);
            overflow: hidden;
        }

        /* Vẽ Cây Đào bằng SVG */
        .tree-svg {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 85vh;
            z-index: 1;
        }

        /* Cánh hoa rơi */
        .petal {
            position: absolute;
            background: var(--sakura);
            border-radius: 150% 0 150% 0;
            opacity: 0.8;
            pointer-events: none;
            animation: petal-fall linear infinite;
        }
        @keyframes petal-fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* Header & UI */
        .header {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 100; text-align: center; width: 85%;
            background: rgba(0,0,0,0.5); padding: 12px; border-radius: 20px;
            border: 1px solid var(--tet-gold);
            box-shadow: 0 0 15px rgba(255, 235, 59, 0.2);
        }
        #secretTitle { font-family: 'Pacifico', cursive; font-size: 1.6rem; color: var(--tet-gold); cursor: pointer; }

        /* Lì xì treo */
        .lixi-wrap {
            position: absolute;
            width: 32px;
            height: 45px;
            z-index: 10;
            cursor: pointer;
            transform-origin: top center;
            animation: swing 4s ease-in-out infinite;
            perspective: 1000px;
        }
        @keyframes swing {
            0%, 100% { transform: rotate(-4deg); }
            50% { transform: rotate(4deg); }
        }

        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .flipped .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--tet-gold);
        }
        .card-front { background: var(--tet-red); box-shadow: 1px 2px 5px rgba(0,0,0,0.4); }
        .card-front::after { content: "🧧"; font-size: 1.1rem; }
        
        /* Chấm ẩn phân biệt cho chủ nhà */
        .mode-high .card-front::before { content: ""; position: absolute; top: 2px; right: 2px; width: 3px; height: 3px; background: var(--tet-gold); border-radius: 50%; opacity: 0.4; }

        .card-back { background: #fff; color: var(--tet-red); transform: rotateY(180deg); font-size: 0.55rem; font-weight: 900; text-align: center; }

        /* Hoa Đào (Vẽ bằng CSS) */
        .blossom {
            position: absolute;
            width: 12px; height: 12px;
            background: #ff80ab;
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 0 5px #ff4081;
        }
        .blossom::before, .blossom::after {
            content: ""; position: absolute; width: 100%; height: 100%;
            background: #ff80ab; border-radius: 50%;
        }
        .blossom::before { transform: rotate(45deg); }
        .blossom::after { transform: rotate(-45deg); }

        .stats-box {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 50px;
            font-size: 0.8rem; z-index: 100; border: 1px solid rgba(255,255,255,0.2);
        }

        .result-popup { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: #fff; border: 6px solid var(--tet-gold); padding: 25px; 
            border-radius: 25px; text-align: center; z-index: 3000; display: none; width: 290px;
        }
        .btn-red { background: var(--tet-red); color: white; border: none; padding: 10px 25px; border-radius: 50px; font-weight: bold; margin-top: 15px; cursor: pointer; }

        /* Admin Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 4000; padding: 20px; color: #333; overflow-y: auto; }
        .modal-content { background: white; padding: 20px; border-radius: 20px; max-width: 400px; margin: auto; }
    </style>
</head>
<body>

<div class="tree-world">
    <div class="header">
        <span id="adminTrigger" style="cursor:pointer; font-size: 1.5rem;">🐴</span>
        <h1 id="secretTitle">Cây Đào Tài Lộc</h1>
        <p id="modeIndicator" style="font-size: 0.6rem; color: var(--tet-gold); letter-spacing: 1px; margin-top: 3px;">TÚI TÀI LỘC</p>
    </div>

    <svg class="tree-svg" viewBox="0 0 500 800" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M250 800C250 800 240 600 250 450C260 300 210 150 250 50" stroke="#3e2723" stroke-width="25" stroke-linecap="round"/>
        <path d="M250 600C250 600 150 550 80 480" stroke="#3e2723" stroke-width="15" stroke-linecap="round"/>
        <path d="M250 550C250 550 380 500 440 420" stroke="#3e2723" stroke-width="15" stroke-linecap="round"/>
        <path d="M250 400C250 400 100 350 50 250" stroke="#3e2723" stroke-width="10" stroke-linecap="round"/>
        <path d="M250 350C250 350 400 300 460 200" stroke="#3e2723" stroke-width="10" stroke-linecap="round"/>
        <path d="M180 300C180 300 120 250 100 180" stroke="#3e2723" stroke-width="8" stroke-linecap="round"/>
    </svg>

    <div id="treeDecor"></div>

    <div class="stats-box">
        Lượt: <span id="picks">0</span> | Tổng: <span id="total" style="color:var(--tet-gold)">0đ</span>
    </div>
</div>

<div class="result-popup" id="resultPopup">
    <p style="color: #666; font-weight: bold;">🧧 Bạn nhận được 🧧</p>
    <div id="winAmount" style="font-size: 2.2rem; font-weight: 900; color: var(--tet-red); margin: 15px 0;">0đ</div>
    <button class="btn-red" onclick="closePopup()">NHẬN LỘC</button>
</div>

<div id="adminModal" class="modal">
    <div class="modal-content">
        <h3>Quản lý (Pass: Test@12345)</h3>
        <input type="password" id="adminPass" placeholder="Mật khẩu..." style="width:100%; padding:12px; margin:15px 0; border:1px solid #ddd; border-radius:10px;">
        <button class="btn-red" style="width:100%" onclick="verifyAdmin()">XÁC NHẬN</button>
        <div id="settingsArea" style="display:none; margin-top:20px;">
             <p>Bạn đã vào chế độ admin. Nhấn Title 3 lần để đổi túi tiền.</p>
             <button class="btn-red" style="background:#666" onclick="location.reload()">TẢI LẠI TRANG</button>
        </div>
    </div>
</div>

<script>
    let currentMode = 'high';
    let globalPicks = 0;
    let globalTotal = 0;
    let titleClicks = 0;
    let adminClicks = 0;

    const config = {
        low: [11111, 12345, 22222, 33333, 36363, 55555, 68000, 88000],
        high: [99999, 111111, 123123, 168168, 200000, 333333, 555555]
    };

    function initTree() {
        const container = document.getElementById('treeDecor');
        container.innerHTML = '';
        
        // 1. Tạo cánh hoa đào rơi
        for (let i = 0; i < 20; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.width = petal.style.height = (Math.random() * 10 + 5) + 'px';
            petal.style.animationDuration = (Math.random() * 5 + 5) + 's';
            petal.style.animationDelay = (Math.random() * 5) + 's';
            document.querySelector('.tree-world').appendChild(petal);
        }

        // 2. Tạo Hoa Đào và Lì Xì (Treo theo vùng cành cây)
        const spots = 60; 
        for (let i = 0; i < spots; i++) {
            const x = 15 + Math.random() * 70;
            const y = 15 + Math.random() * 65;

            // Tạo Hoa Đào
            const blossom = document.createElement('div');
            blossom.className = 'blossom';
            blossom.style.left = x + '%';
            blossom.style.top = y + '%';
            container.appendChild(blossom);

            // Mỗi 2 bông hoa thì treo 1 bao lì xì
            if (i % 2 === 0) {
                const lixi = document.createElement('div');
                lixi.className = `lixi-wrap mode-${currentMode}`;
                lixi.style.left = (x + 1) + '%';
                lixi.style.top = (y + 1) + '%';
                lixi.style.animationDelay = Math.random() * 2 + 's';

                const amt = getAmount();
                lixi.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front"></div>
                        <div class="card-back">
                            <span style="opacity:0.5; font-size:0.4rem;">TẾT 2026</span><br>
                            ${amt.toLocaleString()}đ
                        </div>
                    </div>
                `;
                lixi.onclick = function() {
                    if (!this.classList.contains('flipped')) {
                        this.classList.add('flipped');
                        handleWin(amt);
                    }
                };
                container.appendChild(lixi);
            }
        }
    }

    function getAmount() {
        let pool = [...config[currentMode]];
        if (globalPicks < 5) pool = pool.filter(v => v < 250000);
        return pool[Math.floor(Math.random() * pool.length)];
    }

    function handleWin(amt) {
        globalPicks++; globalTotal += amt;
        document.getElementById('picks').innerText = globalPicks;
        document.getElementById('total').innerText = globalTotal.toLocaleString() + 'đ';
        setTimeout(() => {
            document.getElementById('winAmount').innerText = amt.toLocaleString() + 'đ';
            document.getElementById('resultPopup').style.display = 'block';
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#ffeb3b', '#d32f2f'] });
        }, 500);
    }

    function closePopup() { document.getElementById('resultPopup').style.display = 'none'; }

    // Click 3 lần Title để đổi chế độ
    document.getElementById('secretTitle').onclick = function() {
        titleClicks++;
        if (titleClicks === 3) {
            currentMode = (currentMode === 'high') ? 'low' : 'high';
            document.getElementById('modeIndicator').innerText = currentMode === 'high' ? "TÚI TÀI LỘC" : "TÚI BÌNH AN";
            initTree();
            titleClicks = 0;
            this.style.textShadow = "0 0 20px #fff";
            setTimeout(() => this.style.textShadow = "none", 300);
        }
        setTimeout(() => titleClicks = 0, 1000);
    };

    // Click 3 lần Ngựa để vào Admin
    document.getElementById('adminTrigger').onclick = function() {
        adminClicks++;
        if (adminClicks === 3) { document.getElementById('adminModal').style.display = 'block'; adminClicks = 0; }
        setTimeout(() => adminClicks = 0, 1000);
    };

    function verifyAdmin() {
        if (document.getElementById('adminPass').value === "Test@12345") {
            document.getElementById('settingsArea').style.display = 'block';
        } else { alert("Sai mật khẩu!"); }
    }

    window.onload = initTree;
</script>
</body>
</html>
